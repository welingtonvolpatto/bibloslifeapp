<style>
:root{--text:#2b2d30;--title:#212121;--muted:rgba(41,44,50,.79);--line:#edeef0;--blue:#0E5F95;--blue-d:#0A4A75;--blue-soft:#E8F0F7;--cream:#FDF7EF;--ink:#1E2430;--gold:#C9973F;--green:#19b56b;--green-bg:#e6f7ee;--soft:#f6f7f8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",sans-serif;font-weight:500;color:var(--text);background:var(--cream);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column}
header{height:56px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 8px;position:sticky;top:0;background:var(--cream);z-index:10}
header.transparent{background:transparent}
.hbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.hbtn.hidden{visibility:hidden}
.logo{text-align:center;font-weight:800;font-size:22px;letter-spacing:.5px;color:var(--title)}
.progress{height:4px;background:var(--line);margin:0 16px;border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .35s}
main{flex:1;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding:12px 16px 110px;animation:fade .35s ease}
.screen.center{justify-content:center}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.footer-cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 20px;background:#fff;border-top:1px solid var(--line);z-index:20}
.footer-cta .inner{max-width:398px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:12px;background:var(--blue);color:#fff;font-size:18px;font-weight:700;transition:background .15s,opacity .15s}
.btn:hover{background:var(--blue-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
h1.t{font-size:23px;line-height:28px;font-weight:600;text-align:center;color:var(--text);margin-bottom:8px}
p.s{font-size:14px;line-height:20px;text-align:center;color:var(--muted);margin-bottom:16px}
.q-title{font-size:24px;line-height:1.3;font-weight:700;text-align:center;color:var(--title);padding:10px 8px 6px}
.q-hint{text-align:center;color:var(--muted);font-size:14px;margin-bottom:12px}
.opts{margin-top:12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:20px 16px;margin-bottom:10px;font-size:16px;font-weight:500;transition:border-color .15s,background .15s}
.opt .ico{width:28px;height:28px;flex:none}
.opt .c{width:24px;height:24px;border-radius:50%;border:1px solid #e3e4e7;flex:none;display:flex;align-items:center;justify-content:center}
.opt.multi .c{border-radius:6px}
.opt:hover{border-color:#cfd3da}
.opt.sel{border-color:var(--blue);background:#EEF4FA}
.opt.sel .c{background:var(--blue);border-color:var(--blue)}
.opt.sel .c::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* image tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tile{position:relative;border-radius:14px;overflow:hidden;border:2px solid transparent;background:var(--soft);transition:border-color .15s}
.tile.sel{border-color:#2b2d30}
.tile .img{width:100%;display:block;object-fit:cover}
.tile .lbl{position:absolute;left:10px;right:10px;bottom:10px;height:44px;border-radius:10px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;font-size:17px;font-weight:600;color:#111}
.tile.wide .lbl{height:34px;left:6px;right:6px;bottom:6px;font-size:15px;padding:0 6px 0 12px}
.tile.wide .arr{width:22px;height:22px}
.tile .arr{width:26px;height:26px;border-radius:50%;background:#2b2d30;display:flex;align-items:center;justify-content:center}
/* gender intro */
.social{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 14px}
.social .rate{display:flex;flex-direction:column;align-items:center;font-size:20px;font-weight:700;color:#444}
.social .rate small{font-size:10px;font-weight:600;color:#19b56b}
.social p{font-size:13px;color:#77797e;line-height:1.35;max-width:170px}
.big-title{font-size:27px;line-height:1.25;font-weight:600;text-align:center;letter-spacing:.3px;color:#222;text-transform:uppercase}
.big-sub{font-size:15px;text-align:center;color:#444;margin:10px 0 18px;letter-spacing:.3px;text-transform:uppercase}
.legal{margin-top:24px;font-size:12px;color:#6b6f76;text-align:center;line-height:1.45}
.legal a{color:var(--blue)}
/* info / break */
.hero-img{width:100%;border-radius:12px;display:block;margin-bottom:22px;aspect-ratio:342/220;object-fit:cover}
.info-title{font-size:24px;font-weight:600;text-align:center;line-height:1.3;margin-bottom:12px;color:var(--title)}
.info-text{font-size:16px;line-height:1.45;text-align:center;color:var(--muted)}
.banner{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:12px;margin-top:22px;font-size:14px;line-height:1.4}
.banner .pi{width:44px;height:44px;border-radius:50%;flex:none;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
/* reveal */
.reveal{text-align:center;padding-top:40px}
.reveal .glow{width:150px;height:150px;border-radius:50%;margin:30px auto;background:radial-gradient(circle,#fff6d8 0%,#ffd77a 35%,#c9c5fa 70%,transparent 72%);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.reveal .hint{font-size:13px;color:var(--muted);margin-top:10px}
/* loader */
.ring{width:170px;height:170px;margin:26px auto 30px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700}
.steps li{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;font-size:16px;color:#9a9ca1;transition:color .3s}
.steps li .d{width:22px;height:22px;border-radius:50%;border:2px solid #d9dbe0;flex:none;display:flex;align-items:center;justify-content:center;transition:all .3s}
.steps li.on{color:var(--text)}
.steps li.done .d{background:var(--green);border-color:var(--green)}
.steps li.done .d::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal .box{background:#fff;border-radius:16px;padding:22px 18px;width:100%;max-width:360px;text-align:center;animation:fade .25s}
.modal small{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
.modal h3{font-size:19px;line-height:1.35;margin-bottom:18px;color:var(--title)}
.modal .yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .yn button{height:52px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.modal .yn button:hover{border-color:var(--blue)}
/* summary */
.arch-card{border-radius:16px;padding:20px;margin-top:16px;background:linear-gradient(160deg,#f3f0ff,#e4f1fd);text-align:center}
.arch-card .kicker{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#6b6f76;font-weight:700}
.arch-card .name{font-size:28px;font-weight:800;color:var(--title);margin:6px 0 2px}
.arch-card .role{font-size:15px;color:#4b4e55;font-weight:600}
.arch-card p{font-size:14px;line-height:1.5;color:#4b4e55;margin-top:10px}
.divider{height:1px;background:var(--line);margin:18px 0}
.inside h4{font-size:14px;font-weight:700;margin-bottom:10px}
.inside li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:14px;line-height:1.4}
.inside li b{display:block;font-size:14px}
.inside li span{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chips span{font-size:12px;font-weight:700;background:#fff;border-radius:20px;padding:5px 10px;color:#444}
/* email / name */
.field{width:100%;height:56px;border:1px solid #dfe1e5;border-radius:12px;padding:0 16px;font-size:16px;margin-top:18px;outline:none}
.field:focus{border-color:var(--blue)}
.err{color:#e5484d;font-size:13px;margin-top:6px;min-height:18px}
.privacy{display:flex;gap:10px;margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.45}
.privacy a{color:var(--blue)}
/* cards sequence */
.cards-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5;
  background:linear-gradient(0deg,rgba(255,235,244,.7) 2.43%,rgba(201,197,250,.7) 51.21%,rgba(163,159,212,.7) 100%)}
.stack{position:relative;width:100%;max-width:360px;height:220px}
.stack .card{position:absolute;inset:0;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:26px;text-align:center;font-size:19px;font-weight:600;line-height:1.4;box-shadow:0 10px 30px rgba(60,50,120,.15);opacity:0;transform:translateY(30px) scale(.96);transition:all .6s ease}
.stack .card.show{opacity:1;transform:none}
.stack .card.back{transform:translateY(-14px) scale(.94);opacity:.6}
/* offer */
.topbar{position:sticky;top:0;background:#fff;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.timer{display:flex;flex-direction:column;align-items:center;min-width:110px}
.timer .digits{font-size:34px;font-weight:600;line-height:1;color:#000}
.timer .digits span{margin:0 3px}
.timer .lbl{display:flex;gap:16px;font-size:12px;color:#222;margin-top:4px}
.topbar .btn{flex:1}
.offer{padding:0 16px 32px}
.sec-title{font-size:26px;font-weight:600;text-align:center;color:var(--title);margin:32px 0 20px;line-height:1.25}
.arch-mini{display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px;background:linear-gradient(160deg,#f3f0ff,#e4f1fd);margin-top:20px}
.arch-mini .av{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.arch-mini b{display:block;font-size:17px}
.arch-mini span{font-size:13px;color:#55585e}
.highlights{border:1px solid var(--line);border-radius:12px}
.highlights li{list-style:none;display:flex;gap:16px;padding:16px;font-size:15px;line-height:1.45;color:#3d4046;border-bottom:1px solid var(--line)}
.highlights li:last-child{border-bottom:0}
.highlights svg{flex:none}
.plans{display:flex;flex-direction:column;gap:12px}
.plan{border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.plan .badge{display:none;background:var(--blue);color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:4px 0}
.plan.popular .badge{display:block}
.plan .body{display:flex;align-items:center;gap:14px;padding:18px 14px}
.plan .radio{width:24px;height:24px;border-radius:50%;border:1px solid #e3e4e7;flex:none;display:flex;align-items:center;justify-content:center}
.plan.sel{border-color:var(--blue)}
.plan.sel .radio{background:#2b2d30;border-color:#2b2d30}
.plan.sel .radio::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.plan .info{flex:1}
.plan .name{font-size:19px;font-weight:600;color:var(--title)}
.plan .price{font-size:12.5px;color:#55585e;margin-top:2px;line-height:1.35}
.plan .price b{font-size:14.5px;color:#222;font-weight:700}
.plan .off{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:8px;background:#f3f4f6;color:#55585e}
.plan.sel .off{background:var(--blue);color:#fff}
.plan .day{background:#f5f6f7;border-radius:6px;padding:8px 10px;text-align:center;min-width:88px}
.plan .day small{display:block;font-size:11px;color:#6b6f76;font-weight:500}
.plan .day strong{display:block;font-size:15px;font-weight:700;color:#222;line-height:1.2}
.terms{font-size:12px;color:#6b6f76;text-align:center;line-height:1.5;margin:18px 4px}
.terms a{color:#55585e}
.safe{display:flex;align-items:center;justify-content:center;gap:6px;width:max-content;margin:14px auto 10px;padding:7px 16px;border-radius:8px;background:var(--green-bg);color:var(--green);font-size:15px;font-weight:600}
.faq{border:1px solid var(--line);border-radius:12px}
.faq details{border-bottom:1px solid var(--line)}
.faq details:last-child{border-bottom:0}
.faq summary{list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 16px;font-size:16px;line-height:1.4;color:var(--title);cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;color:#b6b9bf;font-weight:300;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{padding:0 16px 18px;font-size:14.5px;color:#55585e;line-height:1.5}
footer.addr{text-align:center;font-size:12.5px;color:#6b6f76;padding:36px 16px 30px}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:70}
.menu.open{display:block}
.menu .panel{position:absolute;right:0;top:0;bottom:0;width:78%;max-width:320px;background:#fff;padding:24px 20px}
.menu h4{font-size:18px;font-weight:700;margin-bottom:18px}
.menu a{display:block;padding:12px 0;color:var(--text);text-decoration:none;border-bottom:1px solid var(--line);font-size:15px}

/* ===== offer page (VEREDA) ===== */
.o-card.o-social{background:var(--blue-soft);border:0;text-align:center;padding:22px 14px}
.o-social h3{font-size:21px;font-weight:600;line-height:1.35;color:var(--title)}
.o-rate{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:16px;padding:8px;text-align:left}
.o-rate .stores{display:flex;align-items:center;gap:10px;background:#f3f4f6;border-radius:10px;padding:10px 12px}
.o-rate .stores svg{width:24px;height:24px}
.o-rate .stores i{width:1px;height:28px;background:#d9dbe0}
.o-rate .rt span{font-size:14px;color:#3d4046}.o-rate .rt span b{font-size:22px;color:var(--blue);margin-right:2px}
.o-rate .rt strong{display:block;font-size:14px;font-weight:700;color:var(--title)}
.pay{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.pay span{width:40px;height:26px;border:1px solid #e3e4e7;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;min-width:0}
.pay span svg{width:100%;height:100%;display:block}

.hl{color:var(--blue)}
.o-top{position:sticky;top:0;z-index:20;background:var(--cream);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
.o-logo{height:24px}
.o-cta{width:auto;height:44px;padding:0 26px;font-size:15px}
.offer{padding:8px 16px 24px}
.o-h1{font-size:22px;font-weight:400;text-align:center;line-height:1.3;margin:22px 0 14px;color:var(--title)}
.o-h1 b{font-weight:700}
.o-chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.o-chips>div{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--title)}
.o-chips svg{width:22px;height:22px;color:var(--blue);flex:none}
.o-chips small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.o-bubble{position:relative;margin:14px 0 18px;border:1.5px solid #8FD3BF;border-radius:12px;padding:10px 14px;text-align:center;background:#fff}
.o-bubble b{display:block;font-size:14px;color:var(--title)}
.o-bubble span{font-size:12.5px;color:var(--muted);line-height:1.45}
.o-bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:#fff;border-right:1.5px solid #8FD3BF;border-bottom:1.5px solid #8FD3BF;transform:translateX(-50%) rotate(45deg)}
.o-journey{position:relative;background:var(--soft);border-radius:16px;padding:12px 12px 14px;overflow:hidden;margin:0 6px}
.o-journey .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#fff;border-radius:10px;padding:3px;position:relative;z-index:2}
.o-journey .tabs button{height:32px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--blue)}
.o-journey .tabs button.on{background:var(--blue);color:#fff}
.o-journey .tl{padding:12px 0 6px;width:72%;position:relative;z-index:2}
.o-journey .day{display:grid;grid-template-columns:44px 1fr;align-items:center;margin-bottom:12px}
.o-journey .dl{font-size:12px;color:#7a7f87}
.o-journey .bar{display:block;padding:12px 10px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--title);border-left:3px solid}
.bar.k0{background:#d5efe7;border-color:#2f9e83}.bar.k1{background:#fde7dc;border-color:#ec8a5c}.bar.k2{background:#fde7dc;border-color:#c79be8}.bar.k3{background:#fde7dc;border-color:#ec8a5c}
.o-journey .day.fade{opacity:.35}
.o-journey .coach{position:absolute;right:-6px;top:58px;width:44%;z-index:1;-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent);mask-image:linear-gradient(to bottom,#000 70%,transparent)}
.o-journey .jf{position:relative;z-index:2;text-align:center;font-size:12.5px;line-height:1.45}
.o-journey .jf b{display:block}
.o-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:24px}
.o-get h3{font-size:20px;font-weight:600;text-align:center;margin-bottom:16px}
.gi{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.gi p{font-size:13.5px;line-height:1.4;color:var(--muted)}
.gi p b{color:var(--title);font-weight:600}
.gic{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.gic svg{width:18px;height:18px}
.gic.c0{background:#F08A4B}.gic.c1{background:#9B6BD6}.gic.c2{background:var(--blue)}.gic.c3{background:#E54B7A}.gic.c4{background:#2f9e83}
.o-h2{font-size:22px;font-weight:600;text-align:center;line-height:1.3;margin:32px 0 18px;color:var(--title)}
.o-plans{display:flex;flex-direction:column;gap:12px}
.o-plan{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:#fff}
.o-plan.sel{border-color:var(--blue)}
.o-plan .rib{background:var(--blue);color:#fff;text-align:center;font-size:11.5px;font-weight:700;padding:4px 0;display:flex;align-items:center;justify-content:center;gap:5px}
.o-plan .rib svg{width:12px;height:12px}
.o-pb{display:flex;align-items:center;gap:14px;padding:16px 12px}
.o-plan .radio{width:24px;height:24px;border-radius:50%;border:1px solid #e3e4e7;flex:none;display:flex;align-items:center;justify-content:center}

  const key = state.answers.feelDuring+"_"+(state.answers.doFirst||"").replace(/\s/g,"")+"_"+s;
  if(A_LIST.split(" ").includes(key)) return ARCH[g].A;
  if(B_LIST.split(" ").includes(key)) return ARCH[g].B;
  if(C_LIST.split(" ").includes(key)) return ARCH[g].C;
  return ARCH[g].D;
}

function img(file, cls, label, ratio){

function imgFallback(el){ el.onerror=null; el.src=placeholder(el.dataset.ph, el.dataset.r); }
function placeholder(label, ratio){
  const [w,h]=ratio.split("/").map(Number);
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${w} ${h}'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#f4ecdf'/><stop offset='1' stop-color='#d9d4f5'/></linearGradient></defs><rect width='${w}' height='${h}' fill='url(#g)'/><circle cx='${w/2}' cy='${h*0.42}' r='${Math.min(w,h)*0.16}' fill='#fff' opacity='.7'/><text x='50%' y='${h*0.78}' font-family='sans-serif' font-size='${Math.round(Math.min(w,h)*0.07)}' fill='#7a7480' text-anchor='middle'>${label}</text></svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}

      <div class="divider"></div>
      <div class="inside"><h4>What's inside your Archetype Plan:</h4><ul>${PLAN_INSIDE.map(([b,s])=>`<li><span>✅</span><div><b>${b}</b><span>${s}</span></div></li>`).join("")}</ul></div></section>`;
    setCTA("Continue",()=>go());
  },
  email(){
    const DOMAINS=["gmail.com","icloud.com","yahoo.com","hotmail.com","outlook.com","aol.com","live.com","msn.com","me.com","protonmail.com"];
    view.innerHTML = `<section class="screen"><h2 class="info-title" style="margin-top:12px">Enter your email to get your <span class="hl">Personalized Bible Study Plan</span></h2>
      <div class="em-wrap"><div class="em-field"><input id="em" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter your email" value="${esc(state.email)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg></div>
        <ul class="em-sug" id="sug" hidden></ul></div>
      <div class="err" id="er"></div>
      <div class="privacy"><span>🔒</span><span>We respect your privacy and are committed to protecting your personal data. Your data will be processed according to our <a href="${CONFIG.links.privacy}">Privacy policy</a>.</span></div></section>`;
    const inp=$('em'), sug=$('sug');
    const ok=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    const showSug=()=>{
      const v=inp.value.trim(); if(!v){sug.hidden=true;return;}
      const [user,dom='']=v.split('@'); if(!user){sug.hidden=true;return;}
      const list=v.includes('@')?DOMAINS.filter(d=>d.startsWith(dom)&&d!==dom):DOMAINS;
      if(!list.length){sug.hidden=true;return;}
      sug.innerHTML=list.map(d=>`<li data-v="${esc(user)}@${d}">${esc(user)}@${d}</li>`).join('');
      sug.hidden=false;
      sug.querySelectorAll('li').forEach(li=>li.onmousedown=e=>{e.preventDefault();inp.value=li.dataset.v;sug.hidden=true;$('er').textContent='';upd();});
    };
    const upd=()=>setCTA("Continue",()=>{const v=inp.value.trim();if(!ok(v)){$('er').textContent="Please enter a valid email";return;}state.email=v;go();},!inp.value.trim());
    inp.oninput=()=>{$('er').textContent="";showSug();upd();};
    inp.onfocus=showSug; inp.onblur=()=>setTimeout(()=>sug.hidden=true,150);
    upd();
  },
  name(){
    view.innerHTML = `<section class="screen"><h2 class="info-title" style="margin-top:12px">What's your first name?</h2>
      <input class="field" id="nm" type="text" placeholder="First name" autocomplete="given-name" value="${esc(state.name)}"></section>`;
    const upd=()=>setCTA("Continue",()=>{state.name=$('nm').value.trim();sendLead();go();},!$('nm').value.trim());
    $('nm').oninput=upd; upd();
  },
  cards(){
    const texts=["Most people learn their archetype and forget it the next day","But when you live it daily — your faith, decisions and confidence grow","We've created a simple plan to help you do exactly that"];
    const bgs=["#FFFFFF","#F6FBFE","#E4F1FD"];
    view.innerHTML = `<div class="cards-screen"><div class="stack">${texts.map((t,i)=>`<div class="card" style="background:${bgs[i]}">${t}</div>`).join("")}</div></div>`;
    const cs=view.querySelectorAll('.card'); let i=0;
    const step=()=>{ cs.forEach((c,j)=>{c.classList.toggle('show',j===i);c.classList.toggle('back',j<i);}); i++; if(i<cs.length) setTimeout(step,2900); };
    step(); setTimeout(()=>go(),2900*cs.length+300);
  },
  offer(){
    const C=CONFIG, P=C.plans;
    const challenge=({Sensitive:"Overthinking",Overwhelmed:"Overthinking",Calm:"Staying consistent",Hopeful:"Staying consistent",Focused:"Finding time",Energetic:"Finding focus"})[state.answers.feelDuring]||"Overthinking";
    const goal=state.answers.currentRelationship==="In need of renewal"?"Renewed faith":"Closer to God";
    const isC=C.offerVariant==="coupon", $c=C.currency||"$";
    const money=v=>$c+Number(v).toFixed(2);
    const perDay=p=>Number(p.price)/p.days;
    const save=p=>p.compareAt?Math.round((1-p.price/p.compareAt)*100):0;
    const code=((state.name||"FRIEND").replace(/[^A-Za-z]/g,"")||"FRIEND").toUpperCase()+"_"+new Date().toLocaleString("en",{month:"short"}).toUpperCase()+((C.coupon&&C.coupon.suffix)||"");
    const trialP=P.find(p=>p.trialDays);
    const couponBox=()=>!isC?'':(C.coupon.percent>0
      ?`<div class="cp"><div class="cp-h">${ICON.tag}<div><b>Your promo code applied!</b><small>${C.coupon.percent}% off your first purchase. Standard pricing applies on renewal</small></div></div><div class="cp-row"><span class="cp-code">${ICON.check}${esc(code)}</span><span class="cp-t"><b class="tm">0${C.coupon.minutes}:00</b><small><i>minutes</i><i>seconds</i></small></span></div></div>`
      :`<div class="cp"><div class="cp-h">${ICON.tag}<div><b>Your ${trialP?trialP.trialDays+'-day free trial is reserved!':'personal offer is reserved!'}</b><small>${trialP?'Start today for '+money(0)+'. Cancel anytime before the trial ends.':'Your plan is held for you for a few minutes.'}</small></div></div><div class="cp-row"><span class="cp-code">${ICON.check}${esc(code)}</span><span class="cp-t"><b class="tm">0${C.coupon.minutes}:00</b><small><i>minutes</i><i>seconds</i></small></span></div></div>`);
    const badge=p=>save(p)?`<span class="off">SAVE ${save(p)}%</span>`:'';
    const sub=p=>p.trialDays?`<small class="o-ps">${p.trialDays} days free, then ${money(p.price)}/${p.every}</small>`
      :`<small class="o-ps">${money(p.price)} ${isC?'':'billed '}every ${p.every}</small>`;
    const pd=v=>{const [i,c]=v.toFixed(2).split('.');return `<span class="pd"><span class="cur">${$c}</span><span class="int">${i}</span><span class="dec"><b>${c}</b><small>per day</small></span></span>`;};
    const right=p=>{
      if(p.trialDays) return `<div class="${isC?'o-tp':'o-pp'} o-free"><b>FREE</b><small>${p.trialDays} days</small></div>`;
      if(isC) return `<div class="o-tp">${save(p)?`<em>SAVE ${save(p)}%</em>`:''}<b>${money(p.price)}</b>${p.compareAt?`<s>${money(p.compareAt)}</s>`:''}</div>`;
      return `<div class="o-pp">${pd(perDay(p))}</div>`;
    };
    const plansBlock=()=>`<h3 class="o-h2">Your <span class="hl">Personalized Bible Study Plan</span> is ready!</h3>${couponBox()}
      <div class="o-plans">${P.map((p,i)=>`<div class="o-plan ${p.popular?'pop':''}" data-i="${i}">${p.popular?`<div class="rib">${ICON.spark} MOST POPULAR</div>`:''}
        <div class="o-pb"><span class="radio"></span><div class="o-pn"><b>${p.name}</b>${sub(p)}${isC?'':badge(p)}</div>${right(p)}</div></div>`).join('')}</div>
      <div class="o-note">${C.planNote}</div>
      <button class="btn sub">Get my plan</button>
      <p class="o-terms">By clicking “Get my plan”, you agree to automatic subscription renewal. <span class="tdyn"></span> Cancel via the app or email: <a href="mailto:${C.supportEmail}">${C.supportEmail}</a>. See <a href="${C.links.subscription}">Subscription Terms</a> for details.</p>
      <div class="safe">${ICON.shield}Pay safe and secure</div>
      <div class="pay">${PAYLOGOS}</div>`;
    const social = C.social.count ? `<div class="o-card o-social"><h3><span class="hl">${esc(C.social.count)} believers</span> already <span class="hl">grow</span><br>with the ${esc(C.brandName)} app</h3>${C.social.rating?`<div class="o-rate"><div class="stores">${ICON.apple}<i></i>${ICON.play}</div><div class="rt"><span><b>${esc(C.social.rating)}</b> out of 5</span><strong>${esc(C.social.ratingSource)}</strong></div></div>`:''}</div>` : '';
    const stats = C.stats.length ? `<h3 class="o-h2">People just like you achieved great results with ${esc(C.brandName)}!</h3><div class="o-stats">${C.stats.map((x,i)=>`${i?'<div class="sdiv"><i></i><span>✦</span><i></i></div>':''}<div class="srow"><span class="big">${esc(x.value)}<sup>%</sup></span><span>${esc(x.text)}</span></div>`).join('')}<small>${esc(C.statsSource)}</small></div>` : '';
    const reviews = C.reviews.length ? `<h3 class="o-h2">Users love ${esc(C.brandName)}!</h3><p class="o-sub">Become a member of our global community</p>${C.reviews.map(r=>`<div class="o-card o-rev"><div class="stars">${'<i>★</i>'.repeat(r.stars||5)}</div><b>${esc(r.title)}</b><p>${esc(r.text)}</p><div class="who"><span>${esc(r.name)}</span>${r.photo?`<img src="${C.img}${esc(r.photo)}" alt="">`:`<em>${esc((r.name||'').replace(/[^A-Za-z]/g,'').charAt(0)||'?')}</em>`}</div></div>`).join('')}` : '';
    const endorse = C.endorsements.length ? `<div class="o-card"><h3 class="o-h2" style="margin-top:0">Our Bible study plan is based on approaches used by experts from:</h3><div class="o-end">${C.endorsements.map(e=>typeof e==='string'?`<div><b>${esc(e)}</b></div>`:`<div>${e.top?`<small>${esc(e.top)}</small>`:''}<b>${esc(e.name)}</b>${e.bottom?`<small>${esc(e.bottom)}</small>`:''}</div>`).join('')}</div><p class="o-disc">${esc(C.endorsementsNote)}</p></div>` : '';
    const laurel=`<svg viewBox="0 0 70 110" xmlns="http://www.w3.org/2000/svg"><path d="M56 104 C 22 92, 10 60, 22 14" fill="none" stroke="#5E8C6E" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="16" cy="22" rx="5" ry="11" transform="rotate(-25 16 22)" fill="#7FA886"/><ellipse cx="28" cy="26" rx="5" ry="11" transform="rotate(35 28 26)" fill="#5E8C6E"/><ellipse cx="12" cy="40" rx="5" ry="11" transform="rotate(-15 12 40)" fill="#5E8C6E"/><ellipse cx="25" cy="44" rx="5" ry="11" transform="rotate(45 25 44)" fill="#7FA886"/><ellipse cx="12" cy="58" rx="5" ry="11" transform="rotate(-5 12 58)" fill="#7FA886"/><ellipse cx="26" cy="62" rx="5" ry="11" transform="rotate(55 26 62)" fill="#5E8C6E"/><ellipse cx="16" cy="76" rx="5" ry="11" transform="rotate(10 16 76)" fill="#5E8C6E"/><ellipse cx="31" cy="78" rx="5" ry="11" transform="rotate(65 31 78)" fill="#7FA886"/><ellipse cx="25" cy="92" rx="5" ry="11" transform="rotate(25 25 92)" fill="#7FA886"/><ellipse cx="40" cy="92" rx="5" ry="11" transform="rotate(75 40 92)" fill="#5E8C6E"/></svg>`;
    const ratingBlock = (C.ratingBadge && C.social.rating) ? `<div class="rb"><img class="rb-map" src="${C.img}worldmap.svg" alt=""><div class="rb-card"><span class="rb-l">${laurel}</span><div class="rb-c"><b>${esc(C.social.rating)}</b><span class="rb-s">${'\u2605'.repeat(5)}</span><small>${esc(C.social.ratingSource)}</small></div><span class="rb-l rb-r">${laurel}</span></div></div>
      ${C.social.count?`<h3 class="rb-h">${esc(C.social.count)} believers already grow with the ${esc(C.brandName)} app</h3>`:''}
      ${C.reviews.length?`<div class="rc" id="rc">${C.reviews.map(r=>`<div class="rc-i"><div class="rc-top"><em>${r.photo?`<img src="${C.img}${esc(r.photo)}" alt="">`:esc((r.name||'').replace(/[^A-Za-z]/g,'').charAt(0)||'?')}</em><div><b>${esc(r.title)}</b><span class="rc-st">${'<i>\u2605</i>'.repeat(r.stars||5)}</span></div><small>${esc(r.name)}</small></div><p>${esc(r.text)}</p></div>`).join('')}</div><div class="rc-dots">${C.reviews.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}` : '';
    view.innerHTML = `<div class="o-top"><img src="${C.img}logo.svg" alt="${esc(C.brandName)}" class="o-logo"><button class="btn o-cta" id="getPlan">Get my plan</button></div>
    <div class="offer">
      <h1 class="o-h1">Your Personalized<br><b>Bible Study Plan is ready!</b></h1>
      <div class="o-chips"><div>${ICON.alert}<span><small>Main challenge</small>${challenge}</span></div><div>${ICON.bulb}<span><small>Goal</small>${goal}</span></div></div>
      <div class="o-bubble"><b>You’re ready to begin</b><span>Your plan keeps it simple — Scripture in plain words, one small step at a time</span></div>
      <div class="o-journey">
        <div class="tabs">${C.weeks.map((w,i)=>`<button class="${i===0?'on':''}" data-w="${i}">Week ${i+1}</button>`).join('')}</div>
        <div class="tl" id="tl"></div>
        <img class="coach" src="${C.img}${C.images.coach}" alt="" onerror="this.style.display='none'">
        <div class="jf"><b>Keep growing closer to God</b><span>Unlock your complete devotional journey</span></div>
      </div>
      <div class="o-card o-get"><h3>What You get with <span class="hl">${esc(C.brandName)}</span></h3>
        ${C.benefits.map((b,i)=>`<div class="gi"><span class="gic c${i}">${ICON[b.icon]}</span><p><b>${b.lead}</b> ${b.text}</p></div>`).join('')}</div>
      ${social}
      <div id="pA">${plansBlock()}</div>
      ${endorse}${stats}${ratingBlock}
      <div class="o-guide"><b>Study the Bible with clear guidance — not on your own</b>
        <div>${ICON.smile}Simple explanations for every chapter</div><div>${ICON.note}Key takeaways so nothing gets missed</div><div>${ICON.bolt}A daily action to live out what you read</div></div>
      ${C.experience&&C.experience.length?`<h3 class="o-h2">What a day with <span class="hl">${esc(C.brandName)}</span> feels like</h3><div class="o-exp">${C.experience.map((e,i)=>`<div class="o-card ex"><span class="exn">${i+1}</span><b>${esc(e.title)}</b><p>${esc(e.text)}</p></div>`).join('')}</div>`:''}
      <h3 class="o-h2">People often ask</h3>
      <div class="faq">${C.faq.map(f=>`<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join('')}</div>
      <div id="pB">${plansBlock()}</div>
    </div>
    <footer class="addr">${esc(C.companyAddress)}</footer>`;
    const tl=$('tl');
    const showWeek=w=>{tl.innerHTML=C.weeks[w].map((d,i)=>`<div class="day ${i===3?'fade':''}"><span class="dl">Day ${w*4+i+1}</span><span class="bar k${i}">${esc(d)}</span></div>`).join('');view.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.w===w));};
    view.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showWeek(+b.dataset.w)); showWeek(0);
    const sync=()=>{view.querySelectorAll('.o-plan').forEach(p=>p.classList.toggle('sel',+p.dataset.i===state.plan));view.querySelectorAll('.tdyn').forEach(t=>t.textContent=P[state.plan].terms);};
    view.querySelectorAll('.o-plan').forEach(p=>p.onclick=()=>{state.plan=+p.dataset.i;sync();});
    view.querySelectorAll('.sub').forEach(b=>b.onclick=checkout);
    const rc=$('rc'); if(rc){const dots=view.querySelectorAll('.rc-dots i');const n=dots.length;let idx=0;
      rc.addEventListener('scroll',()=>{idx=Math.round(rc.scrollLeft/rc.clientWidth);dots.forEach((d,j)=>d.classList.toggle('on',j===idx));},{passive:true});
      clearInterval(window.__rcT);window.__rcT=setInterval(()=>{if(!document.body.contains(rc))return clearInterval(window.__rcT);idx=(idx+1)%n;rc.scrollTo({left:idx*rc.clientWidth,behavior:'smooth'});},5000);}
    $('getPlan').onclick=()=>$('pA').scrollIntoView({behavior:'smooth'});
    sync();
    if(isC){let t=C.coupon.minutes*60;const tk=()=>{const m=String(Math.floor(t/60)).padStart(2,'0'),ss=String(t%60).padStart(2,'0');view.querySelectorAll('.tm').forEach(e=>e.textContent=m+':'+ss);if(t>0)t--;};tk();clearInterval(window.__cpT);window.__cpT=setInterval(tk,1000);}
  }
};

function ask(q, done){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><small>To move forward, specify</small><h3>${q}</h3><div class="yn"><button>❌ No</button><button>✅ Yes</button></div></div>`;
  document.body.appendChild(m);
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{m.remove();done();});
}
let timerOn=false;
function startTimer(){
  if(timerOn) return; timerOn=true;
  let t=CONFIG.timerSeconds;
  const tick=()=>{const mm=$('mm'),ss=$('ss');if(!mm)return;mm.textContent=String(Math.floor(t/60)).padStart(2,'0');ss.textContent=String(t%60).padStart(2,'0');if(t>0)t--;};
  tick(); setInterval(tick,1000);
}
function sendLead(){
  if(!CONFIG.leadWebhook) return;
  fetch(CONFIG.leadWebhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:state.email,name:state.name,archetype:state.archetype,gender:state.gender,answers:state.answers})}).catch(()=>{});
}
function checkout(){
  const p=CONFIG.plans[state.plan]||{};
  const target=p.checkoutUrl||CONFIG.checkoutUrl;
  if(!target||target==="#") return;
  const u=new URL(target,location.href);
  // keep ad tracking (utm_*, src, sck, xcod, fbclid...) from the landing URL
  new URLSearchParams(location.search).forEach((v,k)=>{ if(!u.searchParams.has(k)) u.searchParams.set(k,v); });
  if(state.email) u.searchParams.set('email',state.email);
  if(state.name)  u.searchParams.set('name',state.name);
  location.href=u.toString();
}
render();
</script>
</body>
</html>
